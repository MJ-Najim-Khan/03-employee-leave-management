  <text x="720" y="505" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">Add department</text>

  <!-- Leave types -->
  <rect x="200" y="634" width="800" height="170" rx="14" fill="#ffffff" stroke="#E2E5EA"/>
