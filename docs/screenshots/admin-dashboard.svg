  <text x="946" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#0B4A3F">Active</text>
  <text x="224" y="360" font-size="13.5" fill="#1C2430"><tspan font-weight="600">EMP003</tspan> - Alice Wong</text>
  <rect x="916" y="346" width="60" height="20" rx="10" fill="#F4F5F7"/>
  <text x="946" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#667085">Inactive</text>

  <!-- Departments -->
  <rect x="200" y="430" width="800" height="180" rx="14" fill="#ffffff" stroke="#E2E5EA"/>
