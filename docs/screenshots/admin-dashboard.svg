  <text x="960" y="860" font-size="13" font-weight="600" fill="#667085">24</text>
  <text x="224" y="892" font-size="13.5" fill="#1C2430"><tspan font-weight="600">jane.doe</tspan> · jane@example.com</text>
  <rect x="880" y="878" width="60" height="20" rx="10" fill="#E8F3F0"/>
  <text x="910" y="892" text-anchor="middle" font-size="12" font-weight="600" fill="#0B4A3F">Active</text>
  <text x="224" y="922" font-size="13.5" fill="#1C2430"><tspan font-weight="600">john.smith</tspan> · john@example.com</text>
  <rect x="880" y="908" width="60" height="20" rx="10" fill="#E8F3F0"/>
  <text x="910" y="922" text-anchor="middle" font-size="12" font-weight="600" fill="#0B4A3F">Active</text>
</svg>
