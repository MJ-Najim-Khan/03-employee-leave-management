<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12876F"/>
      <stop offset="100%" stop-color="#0E6B5C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1040" fill="#F4F5F7"/>

  <!-- Topbar -->
  <rect width="1200" height="60" fill="#12141C"/>
