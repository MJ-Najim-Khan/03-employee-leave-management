  <text x="960" y="462" font-size="13" font-weight="600" fill="#667085">4</text>
  <text x="224" y="494" font-size="13.5" fill="#1C2430">IT</text>
  <text x="224" y="520" font-size="13.5" fill="#1C2430">HR</text>
  <text x="224" y="546" font-size="13.5" fill="#1C2430">Finance</text>
  <text x="224" y="572" font-size="13.5" fill="#1C2430">Sales</text>

