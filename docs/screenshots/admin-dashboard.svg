  <rect x="904" y="122" width="96" height="86" rx="9" fill="#ffffff" stroke="#E2E5EA"/>
  <text x="920" y="146" font-size="12" font-weight="500" fill="#667085">Documents</text>
  <text x="920" y="186" font-size="26" font-weight="650" fill="#1C2430">9</text>

  <!-- Employees -->
  <rect x="200" y="236" width="800" height="170" rx="14" fill="#ffffff" stroke="#E2E5EA"/>
