  <text x="960" y="268" font-size="13" font-weight="600" fill="#667085">18</text>
  <text x="224" y="300" font-size="13.5" fill="#1C2430"><tspan font-weight="600">EMP001</tspan> - Jane Doe</text>
  <rect x="916" y="286" width="60" height="20" rx="10" fill="#E8F3F0"/>
  <text x="946" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#0B4A3F">Active</text>
  <text x="224" y="330" font-size="13.5" fill="#1C2430"><tspan font-weight="600">EMP002</tspan> - John Smith</text>
