  <text x="200" y="252" font-size="16" font-weight="600" fill="#1C2430">Leave Balance</text>

  <rect x="200" y="268" width="320" height="132" rx="9" fill="#ffffff" stroke="#E2E5EA"/>
  <rect x="200" y="268" width="320" height="2" fill="#0E6B5C"/>
  <text x="218" y="296" font-size="13" font-weight="600" fill="#667085">Casual Leave</text>
  <text x="218" y="336" font-size="30" font-weight="700" fill="#1C2430">10</text>
  <text x="218" y="352" font-size="12.5" fill="#667085">days remaining</text>
  <text x="218" y="384" font-size="12" fill="#667085">2 used of 12</text>

  <rect x="540" y="268" width="320" height="132" rx="9" fill="#ffffff" stroke="#E2E5EA"/>
  <rect x="540" y="268" width="320" height="2" fill="#2563A8"/>
