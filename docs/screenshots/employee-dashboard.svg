  <text x="558" y="336" font-size="30" font-weight="700" fill="#1C2430">9</text>
  <text x="558" y="352" font-size="12.5" fill="#667085">days remaining</text>
  <text x="558" y="384" font-size="12" fill="#667085">1 used of 10</text>

  <rect x="880" y="268" width="120" height="132" rx="9" fill="#ffffff" stroke="#E2E5EA"/>
