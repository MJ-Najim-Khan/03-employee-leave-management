  <text x="238" y="526" font-size="13.5" fill="#1C2430">Casual Leave</text>

  <text x="600" y="490" font-size="12.5" font-weight="600" fill="#667085">From Date</text>
  <rect x="600" y="500" width="180" height="42" rx="9" fill="#ffffff" stroke="#D3D8E0"/>
  <text x="614" y="526" font-size="13.5" fill="#1C2430">2026-06-10</text>

  <text x="800" y="490" font-size="12.5" font-weight="600" fill="#667085">To Date</text>
  <rect x="800" y="500" width="200" height="42" rx="9" fill="#ffffff" stroke="#D3D8E0"/>
  <text x="814" y="526" font-size="13.5" fill="#1C2430">2026-06-12</text>

  <text x="224" y="572" font-size="12.5" font-weight="600" fill="#667085">Reason (optional)</text>
  <rect x="224" y="582" width="776" height="80" rx="9" fill="#ffffff" stroke="#D3D8E0"/>
  <text x="238" y="606" font-size="13.5" fill="#1C2430">Family function</text>

  <rect x="224" y="676" width="776" height="34" rx="9" fill="url(#btn)"/>
  <text x="612" y="698" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">Apply Leave</text>

  <!-- Documents -->
  <rect x="200" y="748" width="800" height="150" rx="14" fill="#ffffff" stroke="#E2E5EA"/>
  <text x="224" y="780" font-size="16" font-weight="600" fill="#1C2430">My Documents</text>
  <rect x="224" y="798" width="34" height="34" rx="7" fill="#ffffff" stroke="#E2E5EA"/>
  <text x="241" y="820" text-anchor="middle" font-size="9" font-weight="700" fill="#0E6B5C">PDF</text>
  <text x="270" y="816" font-size="13" font-weight="500" fill="#1C2430">medical-certificate.pdf</text>
  <text x="270" y="830" font-size="11.5" fill="#667085">Uploaded Jun 3, 2026, 9:41 AM</text>

  <!-- Leave history -->
  <rect x="200" y="922" width="800" height="150" rx="14" fill="#ffffff" stroke="#E2E5EA"/>
  <text x="224" y="954" font-size="16" font-weight="600" fill="#1C2430">Leave History</text>
  <text x="224" y="984" font-size="14.5" font-weight="600" fill="#1C2430">Leave Request #12</text>
  <rect x="916" y="968" width="60" height="20" rx="10" fill="#FDF0E1"/>
  <text x="946" y="982" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">Pending</text>
  <text x="224" y="1008" font-size="12.5" fill="#667085">Casual Leave · Jun 10, 2026 – Jun 12, 2026</text>
  <text x="224" y="1028" font-size="13.5" fill="#1C2430">Family function</text>
  <rect x="224" y="1040" width="120" height="28" rx="9" fill="url(#btn)"/>
  <text x="284" y="1058" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Cancel leave</text>
</svg>
