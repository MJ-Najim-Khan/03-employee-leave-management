  <text x="940" y="100" font-size="12.5" font-weight="600" fill="#667085">Employee ID</text>
  <rect x="1020" y="84" width="72" height="28" rx="7" fill="#ffffff" stroke="#D3D8E0"/>
  <text x="1056" y="103" text-anchor="middle" font-size="13.5" fill="#1C2430">1</text>

  <!-- Summary cards -->
  <rect x="200" y="122" width="184" height="86" rx="9" fill="#FDF0E1" stroke="#F1E0C6"/>
  <text x="216" y="146" font-size="12" font-weight="500" fill="#667085">Pending</text>
