  <rect x="400" y="122" width="184" height="86" rx="9" fill="#E8F3F0" stroke="#CDE7E0"/>
  <text x="416" y="146" font-size="12" font-weight="500" fill="#667085">Approved</text>
  <text x="416" y="186" font-size="26" font-weight="650" fill="#1C2430">5</text>

  <rect x="600" y="122" width="184" height="86" rx="9" fill="#FBEAE9" stroke="#F3C7C3"/>
  <text x="616" y="146" font-size="12" font-weight="500" fill="#667085">Rejected</text>
  <text x="616" y="186" font-size="26" font-weight="650" fill="#1C2430">1</text>

  <rect x="800" y="122" width="200" height="86" rx="9" fill="#E8F3F0" stroke="#CDE7E0"/>
