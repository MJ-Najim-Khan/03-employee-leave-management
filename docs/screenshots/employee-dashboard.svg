<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12876F"/>
      <stop offset="100%" stop-color="#0E6B5C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1100" fill="#F4F5F7"/>

  <!-- Topbar -->
  <rect width="1200" height="60" fill="#12141C"/>
  <rect x="24" y="25" width="10" height="10" rx="3" fill="#3B7A57"/>
  <text x="44" y="36" font-size="15" font-weight="600" fill="#F5F5F4">Workspace</text>
  <rect x="1030" y="20" width="76" height="20" rx="10" fill="#EAF5EE"/>
  <text x="1068" y="34" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3B7A57">Employee</text>
  <circle cx="1128" cy="30" r="15" fill="none" stroke="#3B7A57" stroke-width="1.5"/>
  <text x="1128" y="35" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F5F5F4">E</text>
  <text x="1160" y="35" font-size="13" font-weight="500" fill="#E5E5E3">Log out</text>

  <!-- Dashboard header -->
