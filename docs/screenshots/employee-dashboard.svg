  <text x="898" y="336" font-size="30" font-weight="700" fill="#1C2430">8</text>
  <text x="898" y="352" font-size="12.5" fill="#667085">days remaining</text>
  <text x="898" y="384" font-size="12" fill="#667085">7 used of 15</text>

